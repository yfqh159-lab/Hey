name: Sync upstream (safe)

on:
  schedule:
    - cron: "53 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-upstream.yml

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'yfqh159-lab/Hey'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync main from original repository without force
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh repo sync "$GITHUB_REPOSITORY" --branch main
